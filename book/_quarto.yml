project:
  type: book
  output-dir: ../docs/livre

lang: fr
jupyter: mngt60439

book:
  title: "Données et stratégie avec Python"
  subtitle: "MNGT 60439 · Enjeux locaux et mondiaux · HEC Montréal"
  author: "Thierry Warin, PhD"
  date: last-modified
  date-format: "D MMMM YYYY"
  search: true
  repo-url: https://github.com/warint/MNGT60439
  repo-branch: main
  repo-subdir: book
  repo-actions: [source, issue]
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "MNGT 60439 · HEC Montréal"
    right: "Construit à partir du dépôt du cours"
  chapters:
    - index.qmd
    - part: "Python pour la stratégie"
      chapters:
        - seance-01.qmd
        - seance-02.qmd
        - seance-03.qmd
        - seance-04.qmd
        - seance-05.qmd
        - seance-06.qmd
    - part: "Articles et études de cas"
      chapters:
        - seances-07-13.qmd
  appendices:
    - installation.qmd
    - sources-de-donnees.qmd
    - aide-memoire.qmd

bibliography: references.bib
link-citations: true

filters:
  - divs-to-latex.lua

format:
  html:
    theme: [cosmo, book.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-fold: false
    link-external-newwindow: true
    df-print: kable
  pdf:
    documentclass: scrbook
    classoption: [10pt, twoside, openright, numbers=noenddot, chapterprefix=true]
    pdf-engine: xelatex
    mainfont: "Times New Roman"
    sansfont: "Helvetica Neue"
    monofont: "Menlo"
    monofontoptions: [Scale=0.82]
    include-in-header: preamble.tex
    colorlinks: true
    linkcolor: econblue
    citecolor: econblue
    urlcolor: econblue
    toc: true
    toc-depth: 2
    number-sections: true
    fig-pos: "htbp"
    fig-width: 5.0
    fig-height: 3.4
    code-overflow: wrap
    highlight-style: github
    df-print: kable

execute:
  freeze: auto
  warning: false
